<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ONIX - Preview animation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080705;
    }

    * { box-sizing: border-box; }

    html, body, main {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .splash {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo {
      width: min(58vw, 280px);
      animation: arrive 1.6s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    @keyframes arrive { 0% { opacity: 0; transform: scale(.6) rotate(-8deg); } 45% { opacity: 1; transform: scale(1.04) rotate(0); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.94); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 600px) {
      .logo { width: min(68vw, 280px); }
    }
  </style>
</head>
<body>
  <main>
    <section class="splash" aria-label="Animacion de entrada ONIX">
       <img class="logo" src="assets/onix-logo.svg" alt="ONIX">
    </section>
  </main>
</body>
</html>
