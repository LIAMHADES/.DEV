<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ONIX</title>
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://search.google.com">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; min-height: 100vh; place-items: center; overflow: hidden; background: #060705; }
    .symbol { width: min(58vw, 280px); animation: arrive 1s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes arrive { 0% { opacity: 0; transform: scale(.6) rotate(-8deg); } 55% { opacity: 1; transform: scale(1.04) rotate(0); } 100% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .symbol { animation: none; } }
  </style>
</head>
<body>
   <img class="symbol" src="assets/onix-logo.svg" alt="ONIX">
  <script>
    window.setTimeout(() => {
      window.location.replace("https://search.google.com/local/writereview?placeid=ChIJW7lH0W7nuhIRkVBgA523l_c");
    }, 1000);
  </script>
</body>
</html>
